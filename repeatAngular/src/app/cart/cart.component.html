    <h1>Cart Items</h1>

    <div class="row container align-items-center">
        <div class="card" *ngFor="let cart of carts" style="width:250px;margin: 5px;height:380px;margin-left:120px"> 
            <img class="card-img-top" src="{{cart.pImg}}" alt="Card image cap">    
            <div class="card-body">
            
                <div style="font-size:15px;" >
                    
                    <p>name: {{cart.pName}}</p>
                    <p>weight: {{cart.pWeight}}</p>
                    <p>Price: {{cart.pPrice}}</p>
                    
                </div>
             <!-- <a class="btn btn-primary btn-lg btn-block" routerLink="cart" (click)="delete()" >Delete</a>  -->
            </div> 
      </div>
      
    </div>
